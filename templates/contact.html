{% extends 'base.html' %}
{% block title %}Contact Us | Zafac Autospares{% endblock %}
{% block content %}
  <section class="form-grid">
    <div class="form-card">
      <h1>Reach Us</h1>
      <p><strong>WhatsApp:</strong> +254 713 078359</p>
      <p><strong>Phone:</strong> +254 713 078359</p>
      <p><strong>Email:</strong> zafacautospares@gmail.com</p>
      <p><strong>Location:</strong> Isebania Border, Kenya</p>
      <form method="post">
        <label>Name</label>
        <input name="name" required>
        <label>Email</label>
        <input name="email" type="email" required>
        <label>Phone</label>
        <input name="phone" required>
        <label>Message</label>
        <textarea name="message" required></textarea>
        <button class="btn btn-accent" style="margin-top: 12px;" type="submit">Send us a message</button>
      </form>
    </div>
    <div class="panel">
      <h2>Find us</h2>
      <iframe src="https://www.google.com/maps?q=Isebania%20Border%20Kenya&z=13&output=embed" width="100%" height="360" style="border:0; border-radius: 12px;" allowfullscreen="" loading="lazy"></iframe>
    </div>
  </section>
{% endblock %}
